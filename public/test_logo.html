<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body {
  background: #111820;
  margin: 0;
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  gap: 50px;
  align-items: center;
  color: white;
  font-family: 'Manrope', sans-serif;
}
.navbar-container {
  width: 100%;
  max-width: 1300px;
  height: 74px;
  padding: 0 36px;
  background: rgba(28, 24, 22, 0.85);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}
.nav-link {
  color: rgba(245, 240, 235, 0.85);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
}
.nav-link svg {
  width: 11px;
  height: 11px;
  opacity: 0.6;
}
.logo-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
  text-decoration: none;
}
.script-the {
  font-family: 'Alex Brush', cursive;
  font-size: 30px;
  color: #ffffff;
  margin-bottom: -11px;
  transform: rotate(-2deg);
  text-shadow: 0 2px 10px rgba(255,255,255,0.2);
}
.serif-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0.26em;
  color: #ffffff;
  text-transform: uppercase;
}
.outline-btn {
  padding: 10px 24px;
  border-radius: 9px;
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 400;
  text-decoration: none;
  letter-spacing: 0.02em;
  transition: all 0.2s ease;
}
</style>
</head>
<body>

  <!-- Mockup 1: "the PILLAR" -->
  <div class="navbar-container">
    <div class="nav-links">
      <a href="#" class="nav-link">
        Products
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </a>
      <a href="#" class="nav-link">Customization</a>
      <a href="#" class="nav-link">Applications</a>
      <a href="#" class="nav-link">Gallery</a>
    </div>

    <a href="#" class="logo-center">
      <span class="script-the">the</span>
      <span class="serif-main">PILLAR</span>
    </a>

    <div class="nav-links">
      <a href="#" class="nav-link">About Us</a>
      <a href="#" class="nav-link">FAQs</a>
      <a href="#" class="nav-link">Contact</a>
      <a href="#" class="outline-btn">WhatsApp Us</a>
    </div>
  </div>

  <!-- Mockup 2: "the WATER PILLAR" -->
  <div class="navbar-container">
    <div class="nav-links">
      <a href="#" class="nav-link">
        Products
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </a>
      <a href="#" class="nav-link">Customization</a>
      <a href="#" class="nav-link">Applications</a>
      <a href="#" class="nav-link">Gallery</a>
    </div>

    <a href="#" class="logo-center">
      <span class="script-the">the</span>
      <span class="serif-main">WATER PILLAR</span>
    </a>

    <div class="nav-links">
      <a href="#" class="nav-link">About Us</a>
      <a href="#" class="nav-link">FAQs</a>
      <a href="#" class="nav-link">Contact</a>
      <a href="#" class="outline-btn">WhatsApp Us</a>
    </div>
  </div>

</body>
</html>
